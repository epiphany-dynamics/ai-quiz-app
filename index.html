<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // No-flash theme bootstrap — runs before paint, mirrors epiphanydynamics.ai.
      // localStorage.theme: only 'light' is special; everything else is dark.
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        } catch (_e) {
          // Storage blocked (private mode etc.) — keep the dark default.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
